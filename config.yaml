reddit:
  client_id: YOUR_REDDIT_CLIENT_ID
  client_secret: YOUR_REDDIT_CLIENT_SECRET
  user_agent: NODU-Bridge-Monitor/0.1 by NODU
  # 3 -> 8 subreddit. A briefben megnevezett harom mellé azok a közösségek,
  # ahol BIM-koordinátorok és építészek tényleges munkafolyamat-problémákat
  # írnak le (ld. docs/02-lead-volume-audit-2026-07.md P2/15).
  subreddits:
  - Revit
  - ArchiCAD
  - BIM
  - bimlevel
  - AutodeskRevit
  - architecture
  - BlenderBIM
  - openBIM
  # search_queries: ha nincs megadva, a keywords.primary + keywords.pain_points
  # többszavas kifejezéseiből épül (max_search_queries darab) — így egy új
  # kulcsszó az Adminban automatikusan új Reddit-keresés is lesz.
  max_search_queries: 12
  poll_interval_minutes: 60
  post_limit: 25
youtube:
  # A kulcs a git-ignoralt .env-ben van (YOUTUBE_API_KEY) — ez a fajl git-tracked,
  # ide NEM kerulhet eles kulcs. Ld. env_secrets.py.
  api_key: ''
  search_queries:
  - Revit Archicad IFC
  - Archicad to Revit tutorial
  - Revit to Archicad workflow
  max_videos_per_query: 5
  max_comments_per_video: 20
  poll_interval_minutes: 180
# Graphisoft Community és Autodesk Forum Khoros SPA — a Playwright connector kezeli.
# Itt csak a hagyományos HTML-alapú fórumok maradnának.
#
# 2026-07-24: KIVEZETVE a revitforum. A revitforum.org phpBB-ről XenForo-ra
# migrált, Cloudflare + login mögé: a `search.php?...` 302-vel átirányít
# `/search?...`-ra, és a html_connector phpBB-szelektorai (li.bg1, a.topictitle)
# soha többé nem illeszkedhetnek. 86 futáson keresztül 0 elemet hozott 0
# hibajelzéssel. Ha újra kell, akkor a `playwright.forums` alá, saját
# szelektorokkal — nem ide. Ld. docs/02-lead-volume-audit-2026-07.md §3.4.
forums: {}
keywords:
  primary:
  - nodu
  - nodu bridge
  - archicad revit
  - revit archicad
  - archicad to revit
  - revit to archicad
  - ifc conversion
  - ifc exchange
  - ifc interoperability
  - ifc export
  - ifc import
  - parametric conversion
  - ac to rvt
  - rvt to ac
  - archicad ifc
  - revit ifc
  - ifc workflow
  - ifc roundtrip
  - bim interoperability
  - bim collaboration
  - model exchange
  - cross platform bim
  pain_points:
  # ELV: a kulcsszót a lehető LEGRÖVIDEBB szótörzsben írd ("missing element",
  # ne "missing elements") — a szűrő toldalék-toleráns a kulcsszóról a szöveg
  # felé (3+ karakteres tokenre), tehát a rövidebb alak a hosszabbat is
  # megfogja, visszafelé viszont NEM. Ld. filters/keyword_filter.py.
  - ifc export problem
  - missing element
  - geometry issue
  - geometry disappear
  - lost parameter
  - duplicate geometry
  - data loss
  - ifc2x3
  - ifc4
  - archicad interop
  - ifc broken
  - ifc mess
  - ifc nightmare
  - ifc frustrating
  - wrong geometry
  - missing data
  - corrupted ifc
  - ifc crash
  - export failure
  - import failure
  - lost data
  - broken model
  - interop issue
  - collaboration problem
  - file conversion
  # Tünet-megfogalmazások (2026-07-24). Az emberek a TÜNETET írják le, nem a
  # formátumot: "losing element properties when importing to Revit" korábban
  # kiesett, mert minden kulcsszó két konkrét tokent (archicad/revit/ifc) kért.
  # A kulcsszó-szűrő csak elő-szűrő — a valódi fájdalmat a classifier dönti el,
  # ezért itt megengedőbbnek KELL lennie. Ld. docs/02-lead-volume-audit-2026-07.md §3.10.
  # Megjegyzés: a -y -> -ies többes szám (property/properties) NEM fedhető le
  # egy szótörzzsel, ezért ott a többes alak szerepel.
  - losing parameter
  - losing properties
  - losing data
  - lost properties
  - properties disappear
  - parameter disappear
  - element disappear
  - walls break
  - geometry breaks
  - model breaks
  - roundtrip problem
  - roundtrip issue
  - mapping problem
  - mapping issue
  - export broken
  - import broken
  - reimport problem
  - conversion problem
  - conversion issue
  - conversion fails
  - export fails
  - import fails
  - not coming through
  - comes through wrong
  - manual rework
  - remodel everything
  - rebuild manually
  - retype parameters
  - copy paste manually
  context:
  - bim coordinator
  - bim manager
  - file exchange
  - open bim
  - bim coordination
  - multi-discipline
  - bim workflow
  - design coordination
  - model coordination
  - building information
  - ifc standard
  - openBIM
alerts:
  email:
    enabled: false
    smtp_host: smtp.gmail.com
    smtp_port: 587
    from_address: YOUR_EMAIL@gmail.com
    to_address: poczai@nodu.build
    app_password: YOUR_APP_PASSWORD
  slack:
    enabled: true
    # A webhook-URL a .env-ben el (SLACK_WEBHOOK_URL) — NEM itt. Az URL onmagaban
    # titok: aki ismeri, a csatornara irhat, es ez a fajl git-tracked (ugyanaz az
    # ok, mint a GEMINI_API_KEY-nel, HANDOFF §5). Az itteni ertek csak visszafele-
    # kompatibilitasi fallback, hagyd uresen.
    # URL nelkul minden Slack-ut CSENDBEN KIHAGYJA magat (nem hiba, nem crash),
    # es a digest NEM allitja 'alerted'-re a posztokat.
    # Teszt: python main.py --test-slack
    webhook_url: ''
    # Hany jel keruljon EGY Slack-uzenetbe. A digest MINDEN jelet kikuld, tobb
    # uzenetre lapozva (korabban csak az elso 5-ot reszletezte, a tobbit
    # "... es meg N tovabbi"-ba osszesitette — 90 felgyult jelbol 85 igy
    # lathatatlanul elhasznalodott volna). Felso korlat 49: a Slack Block Kit
    # 50 blokk/uzenet limitje mellett a fejlec is egy blokk.
    posts_per_message: 20
  webhook:
    enabled: false
    url: YOUR_N8N_WEBHOOK_URL
    min_score: 5
  # min_keyword_matches: MÁR NEM a napi digest szűrője. A digest a Pain
  # Classifier jeleire épül (alerts.digest_min_severity), nem a nyers
  # kulcsszó-score-ra — ld. docs/02-lead-volume-audit-2026-07.md §3.6c.
  min_keyword_matches: 1
  digest_min_severity: 3
  daily_digest: true
  digest_hour: 8
database:
  path: nodu_monitor.db
backup:
  enabled: true
  hour: 3        # napi snapshot ekkor (UTC-fuggetlen local cron)
  keep: 7        # ennyi legfrissebb snapshot marad meg a backups/ mappaban
# Connector-heartbeat: a nema hibak (eltort szelektor, halott API, hianyzo kulcs)
# felderitese. A "0 uj poszt" MAGABAN nem hiba — csak az, ha a connector 0 NYERS
# elemet lat, vagy minden futasa kivetellel all le.
health:
  enabled: true
  check_interval_hours: 6
  window: 5              # ennyi utolso futast ertekel connectoronkent
  active_within_hours: 24 # csak a 24 oran belul futott connectorokat vizsgalja
  # A HIANYZO futas kapuja: ha egy utemezett connector a periodusa x stale_factor
  # ideje nem futott, 'stale' statuszt kap es riasztast valt ki. 2026-07-28-ig ez
  # nem letezett — ami nem futott, az nem is szerepelt a riportban, tehat 5
  # connector csendben eltunt, a /health pedig 200-at adott (audit §2.2).
  # 2.5-nel: egy 90 perces connector ~3,75 ora utan, a napi backup ~2,5 nap utan szol.
  stale_factor: 2.5
  ignore:                # stage-ek, ahol a 0 elem normalis allapot
  - classifier
# Valasz-draftok automatikus generalasa a fajdalom-jelekbol. Az emberi kapu a
# JOVAHAGYASNAL van (dashboard), nem a generalasnal.
responder:
  auto_generate: true
  hour: 7
  # Platformok, amikre NEM készül válaszjavaslat — se a napi 07:30-as batch-ben,
  # se a dashboard "Választervezet" gombjával. A poszt továbbra is BEJÖN, jelként
  # látszik és számít a riportokban: csak válasz nem megy rá.
  #
  # speckle: Zoltán döntése (2026-07-26, HANDOFF §7/K). A speckle.community a
  # versenytárs SAJÁT fóruma, és a második legjobb jelforrásunk (82,9% fájdalom-
  # arány) — de a saját termékünket pozicionáló válasz a versenytárs fórumán
  # reputációs kockázat. Marad tiszta intelligence-forrásnak.
  #
  # graphisoft-support: nem döntés kérdése, hanem tényállítás — a Zendesk-cikkek
  # szerzője a Graphisoft supportja, a kommentek le vannak tiltva. Nincs kinek
  # válaszolni. Ez a forrás piaci intelligencia, nem lead (HANDOFF §7/M).
  exclude_platforms:
  - speckle
  - graphisoft-support
scoring:
  gemini_enabled: true
  gemini_model: gemini-2.5-flash
  # A kulcs a git-ignoralt .env-ben van (GEMINI_API_KEY). A GitHub push-protection
  # 2026-07-25-en elutasitotta azt a commitot, amiben ez a mezo eles kulcsot
  # tartalmazott — joggal. Ide NEM kerulhet vissza.
  gemini_api_key: ''
classifier:
  enabled: true
  # 15 -> 25: a P1-javitasok utan egyetlen este 93 uj poszt jott be (a korabbi
  # napi ~1 helyett), amit a 15-os batch orankent nem gyoz le. 25 x 13 s = ~5,5
  # perc/futas, orankent futva ez naponta 600 poszt kapacitas.
  batch_size: 25
  # MERT ertek, nem tipp (2026-07-28, audit §3.9). A 13 s meg az INGYENES Gemini-
  # szinthez lett hangolva (5 RPM), de a szamlazas 2026-07-25 ota be van kapcsolva
  # (§4/9). Lepcsozetes eles meres 6-6 poszttal: 13 s -> 13,2 s/poszt (4,5 RPM);
  # 5 s -> 6,2 s/poszt (9,7 RPM); 2 s -> 3,3 s/poszt (18,1 RPM). Tartos kor 30
  # poszttal 2 s-nal: 3,9 s/poszt (15,2 RPM), es MIND a 48 hivas 429 NELKUL futott.
  # 100 poszt atfutasa: 13 s-nal ~3 ora (4 utemezett korben), 2 s-nal ~6,5 perc.
  # Ha 429 jelenik meg a runs.error-ban, emeld 5-re — a classifier maga is var
  # 20 s-ot perc-kvota eseten.
  delay_seconds: 2
  draft_min_severity: 3
stackoverflow:
  # KIVEZETVE 2026-07-28 (audit §3.6). Élettartam-mérés: 37 futás, 1887 nyers elem
  # → 5 poszt → 0 osztályozott jel, 320 s futásidő. Az utolsó 48 órában 26 futás,
  # 1326 elem, 0 új poszt. Ez nem hiba (nincs error), csak terméketlen — ugyanaz a
  # kategória, mint a buildingSMART keresés nélkül (§7/L). A kód és a config MARAD,
  # hogy egy `enabled: true`-val visszakapcsolható legyen; az ütemező és a heartbeat
  # az `enabled` alapján hagyja ki. CLI-ból továbbra is futtatható: --stackoverflow.
  enabled: false
  api_key: ''
  poll_interval_minutes: 180
  # A softwareengineering.stackexchange BIM-témában gyakorlatilag üres — kivezetve.
  sites:
  - stackoverflow
  # A tag-szeparátor `;` (ÉS-kapcsolat), NEM `+`. A korábbi `revit+archicad`
  # egy nem létező tag-névre keresett, ezért örökre 0 találatot adott.
  # Élesben mért találatszám: revit-api=25, revit=25, revit;archicad=1.
  tagged_queries:
  - revit-api
  - ifc
  text_queries:
  - archicad revit ifc conversion
  - archicad to revit parametric
  - ifc export missing parameters
  - revit ifc import geometry
github:
  poll_interval_minutes: 240
  token: ''
  repos:
  - IfcOpenShell/IfcOpenShell
  - specklesystems/speckle-server
  - xeokit/xeokit-sdk
  # Élesben mért elérhető issue-szám ugyanezen 3 repóra (2026-07-24):
  #   "archicad revit" = 30 | "archicad" = 103 | "revit" = 303
  # A szűk, kétszavas query-k a fejtér ~10%-át látták. A kulcsszó-szűrő
  # utána amúgy is szűr, ezért itt szélesebb halmazt kérünk le.
  # A token nélküli limit 10 kérés/perc; a connector 6 s-ot vár hívások közt,
  # tehát max 10 query fér bele biztonsággal egy körbe.
  queries:
  - archicad
  - revit
  - ifc export
  - ifc import
  - archicad revit
  - interoperability
# Web-keresés a kivezetett Google CSE helyett, SearchProvider adapter mögött.
# A kulcs NEM ide jön: env-változóból vagy a projekt .env fájljából (BRAVE_API_KEY).
# Kulcs: https://brave.com/search/api/ — self-serve regisztráció.
#
# KVÓTA-MATEK (2026-07-24-én az oldalról ellenőrizve): a Brave "Search" csomag
# $5 / 1000 kérés, ÉS havi $5 ingyenes kredit jár hozzá -> kb. 1000 kérés/hó
# ingyen. A lenti 11 query naponta EGYSZER = ~330 kérés/hó, azaz a szabad
# keret harmada. Ha 720 percre (naponta 2x) állítod, ~660/hó — még belefér, de
# szűkebben. Frissebb adat = kevesebb tartalék; ez a cél (lefedettség, nem
# volumen) mellett nem éri meg.
#
# A cél nem a volumen, hanem a lefedettség: amire nincs saját connector —
# német/holland/skandináv BIM-közösségek, blogkommentek, publikus LinkedIn- és
# Reddit-posztok (ld. docs/02-lead-volume-audit-2026-07.md §5a).
web_search:
  enabled: true
  provider: brave
  api_key_env: BRAVE_API_KEY
  poll_interval_minutes: 1440  # naponta 1x — az ingyenes kredit ~harmada
  results_per_query: 20
  # freshness: py (elmúlt év), NEM pm (elmúlt hónap). Élesben mérve 2026-07-24:
  #   pm  -> az "archicad revit ifc site:reddit.com" 4 találatot adott, MIND
  #          mozi-szál (az "IFC" a filmes Independent Film Channel is!), 0 hasznos.
  #          A szűk időkeretben a Brave részleges egyezésekre esik vissza.
  #   py  -> 10 találat, 10/10 átmegy a kulcsszó-szűrőn, és MIND 1 éven belüli,
  #          tehát egyik sem esik ki az insert_post 365 napos szűrőjén.
  #   ""  -> szintén 10/10, de 2015-es szálak is jönnek, amiket a DB eldob -> kvótapazarlás.
  freshness: py
  search_lang: ''
  queries:
  - archicad revit ifc problem
  - archicad to revit parameters lost
  - ifc export archicad revit forum
  - archicad revit interoperability help
  - "archicad revit ifc problem site:linkedin.com"
  - archicad revit ifc probleme      # DE
  - archicad revit ifc probleem      # NL
  # Reddit a keresőindexen keresztül. Ez a LEGÁLIS út a Reddit-tartalomhoz, amíg
  # nincs jóváhagyott API-kulcsunk: a kereső indexét fogyasztjuk (cím + URL +
  # kivonat), NEM a redditet crawlerezzük. A reddit.com/robots.txt ugyanis
  # `User-agent: * / Disallow: /`, és az unauthenticated `.json` végpont 2026
  # májusa óta 403-at ad (TLS-fingerprint + IP-reputáció) — ld.
  # docs/02-lead-volume-audit-2026-07.md §5a.
  # A szálat ember nyitja meg a linkről; automatikus letöltés NINCS.
  #
  # Query-forma élesben hangolva (2026-07-24): a PROBLÉMA-orientált szavak
  # ("export", "import problem", "parameters lost") valódi hibaszálakat hoznak
  # (10/10 átmegy a szűrőn, score 21-28), míg a puszta "archicad revit"
  # összehasonlító threadeket ("melyiket tanuljam?") — azokat a classifier
  # amúgy is is_pain=false-ra teszi, tehát kár rájuk a kvóta.
  - "archicad revit ifc export site:reddit.com"
  - "archicad revit ifc import problem site:reddit.com"
  - "archicad revit parameters lost site:reddit.com"
  - "archicad revit ifc site:reddit.com"
discourse:
  poll_interval_minutes: 240
  # A /search.json relevancia szerint rendez, ezért ugyanazt a statikus top-50-et
  # adta minden körben (190 elem, 38 új ÖSSZESEN 53 futás alatt). Most minden
  # query lefut relevancia- ÉS friss-rendezéssel (order:latest), lapozással,
  # plusz a /latest.json friss témái is bejönnek.
  # 1 lap/query: a buildingSMART Discourse-a szigorúan rate-limitel (429 már
  # ~8 gyors kérésnél is). A 2. lap amúgy is a relevancia-rangsor alja.
  search_pages: 1
  include_latest: true
  forums:
    buildingsmart:
      base_url: https://forums.buildingsmart.org
      queries:
      - revit archicad
      - archicad revit
      - ifc export revit
      - archicad ifc
      # KERESÉS KIKAPCSOLVA (Zoltán döntése, 2026-07-26, HANDOFF §7/L): a
      # buildingSMART robots.txt-jében is szerepel a `Disallow: /search`, ami a
      # /search.json-ra is illik (§4/15). Innentől csak a /latest.json fut.
      #
      # MIÉRT CSAK 3 LAP? Élesben mérve 12 lap = 360 téma, és abból ÖSSZESEN 3
      # menthető: 37 megy át a kulcsszó-szűrőn, de 34 régebbi 1 évnél (az
      # insert_post eldobja), a 2. laptól pedig már nulla az új hozam. Ez egy
      # lassan mozgó fórum, ahol ráadásul csak 2/30 témának van excerpt-je —
      # a szűrő itt gyakorlatilag csak a címet látja. A mélyebb lapozás tehát
      # nem hozna semmit, csak kéréseket. A 3 lap tartalék a kimaradt körökre.
      use_search: false
      include_latest: true
      latest_pages: 3
    # Speckle — a versenytárs fóruma, DE a legjobban célzott tartalom: a keresés
    # csupa "Archicad to Revit workflow", "Archicad Wall not coming to Revit"
    # típusú találatot ad. Discourse (élesben verifikálva: /about.json,
    # /latest.json, /search.json mind Discourse-séma; /api/v2/discussions 404).
    #
    # A KERESÉS ITT KI VAN KAPCSOLVA: a robots.txt `Disallow: /search` szabálya
    # a /search.json-ra is illik (prefix-egyezés, nincs záró perjel — az OSArch-on
    # `/search/` van, ami NEM illik rá). Helyette a lapozott /latest.json adja a
    # mélységet, ami itt bőven elég: rate limit nincs (8 gyors kérés mind 200).
    #
    # MIÉRT 5 LAP? A 20 lapos mély lapozás EGYSZERI backfill volt (2026-07-26,
    # 600 téma → 35 poszt). Élesben mérve a szűk keresztmetszet nem a kor, hanem
    # a keyword_filter: 600 témából 42 megy át rajta, abból 35 esik 1 éven belülre.
    # A hozam laponként közel egyenletes (~1,75), tehát nincs éles vágási pont —
    # üzemben viszont a mély lapok csak ugyanazt olvassák újra 4 óránként. Az új
    # tartalom a 0-2. lapon jelenik meg (a Discourse bumpolja az aktív témákat),
    # 5 lap = 150 téma bőven fedi a kimaradt ciklusokat is. Ha egyszer hosszabb
    # kiesés volt, állítsd ideiglenesen 20-ra egy körre.
    speckle:
      base_url: https://speckle.community
      use_search: false
      include_latest: true
      latest_pages: 5
# Vanilla Forums — OSArch (community.osarch.org), openBIM/IfcOpenShell közösség.
# NEM Discourse (élesben mérve 2026-07-26: /latest.json 404, /search.json Vanilla-
# sémát ad) — ezért külön connector, nem discourse-config. Két nyitott végpont:
# /api/v2/discussions (friss témák TELJES törzzsel) + /search.json?Search= (lapoz,
# komment-szintű találatot is ad). Rate limit nem mért: 8 gyors kérés mind 200,
# ezért itt 2 lap/query is belefér (a buildingSMART-tal ellentétben).
vanilla:
  enabled: true
  poll_interval_minutes: 240
  search_pages: 2
  include_recent: true
  recent_limit: 50
  forums:
    osarch:
      base_url: https://community.osarch.org
      queries:
      - revit archicad
      - archicad revit
      - ifc export revit
      - archicad ifc
# Zendesk Help Center — Graphisoft support (support.graphisoft.com).
# NEM leadforrás: a cikkeket a Graphisoft supportja írja, a kommentek le vannak
# tiltva, nincs kit megszólítani. Ezért a `graphisoft-support` rajta van a
# `responder.exclude_platforms` listán. Piaci intelligencia: azt mutatja, melyik
# interop-probléma fordul elő elégszer ahhoz, hogy KB-cikk szülessen róla.
# Ld. HANDOFF §7/M. A community halott (5 db 2020-as Zendesk-demo poszt).
zendesk:
  enabled: true
  poll_interval_minutes: 720
  sites:
    graphisoft-support:
      base_url: https://support.graphisoft.com
      locale: en-us
      # Csak a két interop-szekció. A teljes KB 234 kulcsszó-találatából a
      # maradék ~200 licencelési/BIMcloud/BIMx/renderelési zaj — a magas
      # score-ú interop-cikkek MIND ebben a kettőben vannak. Névvel adjuk meg,
      # a connector futásidőben oldja fel id-re.
      sections:
      - Collaboration with Other Software
      - Project Data & BIM
playwright:
  enabled: true
  headless: true
  timeout_ms: 15000
  poll_interval_minutes: 90
  forums:
    graphisoft:
      search_urls:
      - https://community.graphisoft.com/t5/forums/searchpage/tab/message?q=archicad+revit
      - https://community.graphisoft.com/t5/forums/searchpage/tab/message?q=ifc+export+revit
      message_selector: .lia-quilt-column-left-content
      title_selector: .MessageSubject a
      body_selector: .lia-message-body-content
      author_selector: .lia-message-byline a
      cookie_banner_text: Use necessary cookies only
    autodesk:
      search_urls:
      - https://forums.autodesk.com/t5/forums/searchpage/tab/message?q=archicad+ifc+revit
