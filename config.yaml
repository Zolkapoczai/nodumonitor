# LinkedIn Thought Leadership Engine (responder/linkedin_engine.py) — a
# "LinkedIn válasz" fül kommentgenerálása.
linkedin:
  # brand_positioning — a márkaemlítés a POSZT tulajdonsága, nem globális kapcsoló:
  #   on_request — (ALAPÉRTELMEZÉS) csak akkor említhető a NODU Bridge, ha a poszt
  #                KIFEJEZETTEN eszközt kér ("mivel oldjátok meg?"), az idézett
  #                kérdés ellenőrizhetően szerepel a posztban, ÉS a téma
  #                Bridge-relevans (archicad/revit/interoperability/ifc).
  #                Ha valaki megkérdezi, a válasz nem spam; ha nem kérdezi, az.
  #   off        — soha, kifejezett kérdésre sem (szigorú mód).
  #   auto       — a docs/03-linkedin-composer-spec.md §14 három-ágú márkadöntése,
  #                a poszt kérdésétől függetlenül.
  # A döntés indoka minden válaszban ott van: `brand_gate_reason`.
  # IDÉZŐJEL KELL: a YAML az off/on/yes/no szavakat booleanná alakítja, és akkor
  # a string-összehasonlítás csendben mindig hamis lenne.
  brand_positioning: 'on_request'
  # intent_layer — Conversation Intent Layer (2026-07-29, engine v2).
  #   'on'  — (ALAPÉRTELMEZÉS) a motor a stratégia-választás ELŐTT eldönti, MILYEN
  #           szakmai beszélgetésbe száll be (conversation_intent), és MELYIK
  #           síkon beszél a szerző (discourse_level: technical/management/
  #           business). Az intent súlyozza a stratégia-pontszámokat; technikai
  #           síkon a business_impact stratégia VETÓZOTT.
  #           Indok: 30+ kézzel értékelt poszt mérése — vélemény-/debate-posztokon
  #           91-95/100, de mesterség-, tutorial- és portfólió-posztokon a motor
  #           üzleti stratégiává emelte a témát, amit a szerző szándékosan
  #           technikai szinten tartott.
  #   'off' — a v1-es viselkedés: minden stratégia egyenlően versenyez, nincs
  #           vetó, és a compose-prompt sem kap intent/szint sort. A döntés bitre
  #           azonos az engine v1-essel — így ugyanezen a kódon A/B-zhető.
  # IDÉZŐJEL KELL: a YAML az on/off szavakat booleanná alakítja (HANDOFF §4/17).
  intent_layer: 'on'
  # image_input — a poszt képe mint BESOROLÁSI kontextus (2026-07-31).
  #   'on'  — (ALAPÉRTELMEZÉS) a LinkedIn-fülön csatolható a poszt képe. A kép CSAK
  #           a REASON-hívásba megy, a COMPOSE-ba nem: a besorolást pontosítja
  #           (conversation_intent, discourse_level, topic_gravity), a komment
  #           szövege viszont a poszt szövegén áll. Indok: a render-, fotó- és
  #           screenshot-alapú posztok (portfolio_showcase / craftsmanship /
  #           technical_tutorial) eddig gyakorlatilag a caption alapján soroltak be.
  #           A kommentben a képre hivatkozni TILOS, és ezt determinisztikus kapu
  #           kényszeríti ki: a kép állításait kódban nem tudjuk ellenőrizni.
  #   'off' — a kép-választó meg sem jelenik, és egy kézzel küldött kép sem megy el.
  # Megjegyzés: ha az intent_layer 'off', a kép akkor sem megy el, mert a besorolás
  # eredményét a kikapcsolt layer eldobná — elküldeni tiszta token-veszteség lenne.
  image_input: 'on'
  # image_max_px — a böngésző ENNYIRE skálázza a képet feltöltés előtt (leghosszabb
  # oldal). A Gemini kép-tokenizálásában mindkét oldal <= 384 px esetén a kép FIX
  # 258 token; efölött 768x768-as csempék jönnek, csempénként 258 — egy nyers
  # 1200x900-as screenshot így már ~1032 token (4x). A 384 elég ahhoz, hogy a modell
  # render / fotó / diagram / screenshot között döntsön; screenshotról SZÖVEGET
  # olvasni viszont nem elég. Ha az kell, 768 a következő értelmes érték.
  # Az átméretezés a kliensen történik: nincs Pillow-függőség és nincs szerver-CPU.
  image_max_px: 384
  # model — CSAK a LinkedIn-komment motor modellje (2026-08-01).
  # Üres/hiányzó -> örökli a scoring.gemini_model-t, tehát a viselkedés
  # VÁLTOZATLAN. A szétválasztás önmagában nem változtat semmit, csak lehetővé
  # teszi a külön hangolást.
  #
  # MIÉRT: a scoring.gemini_model EGYETLEN érték, amit HAT hívási hely oszt — a
  # Pain Classifier (napi több száz hívás), a négy draft_generator-út és ez a
  # motor. A két véglet ellentétes követelményű:
  #   classifier       nagy volumen, strukturált JSON a kimenet  -> a KÖLTSÉG számít
  #   LinkedIn compose pár kézi hívás/nap, nyilvános szöveg      -> a MINŐSÉG számít
  # A compose-utat drágább modellre vinni néhány cent; ugyanezt a classifierre
  # rávinni a 3.6 Flash árazásán (input 5x, output 3x a 2.5 Flash-hez képest)
  # nagyságrendi becslés szerint ~3,7x-re emeli annak az útnak a havi számláját.
  #
  # Árak (paid tier, 1M token, a 2026-07-30-i doksi szerint):
  #   2.5 Flash        $0.30 / $2.50   (jelenlegi, stabil, nincs kivezetés bejelentve)
  #   3.5 Flash-Lite   $0.30 / $2.50   (azonos ár, újabb generáció — A/B jelölt)
  #   3.6 Flash        $1.50 / $7.50   (a compose-út jelöltje)
  #   3.5 Flash        $1.50 / $9.00   SZIGORÚAN DOMINÁLT — azonos input, drágább
  #                                    output, mint a 3.6 Flash. Soha ne ezt.
  # A thinking-tokenek az output-tarifán számláznak, felár nélkül.
  #
  # FIGYELEM a modellváltás előtt: a kód mindenhol thinking_budget=0-t küld, mert a
  # projekt KÉTSZER mérte, hogy a thinking a max_output_tokens keretből fogyaszt és
  # csonka JSON-t okoz (§4/1). A telepített SDK (2.10.0) a thinking_level-t is
  # támogatja, és a mai doksi már azt dokumentálja — 3.x modellen ez a valószínűleg
  # helyes felület, de ezt élesben kell igazolni, nem doksiból eldönteni.
  model: ''
  # temperature — a szöveg-variancia legközvetlenebb kara (2026-08-01).
  # TÉNY: a kódbázis eddig SOHA nem állította, tehát mindkét hívás a szerver-oldali
  # defaulton futott. Hogy az pontosan mennyi, az NEM DOKUMENTÁLT: a google-genai
  # SDK-ban a mező default értéke None (tehát nem küldjük), és a Gemini
  # text-generation doksi sem közöl default értéket. Csak az irány biztos: a
  # dokumentáció szerint az alacsonyabb érték kevésbé nyitott/kreatív kimenetet ad.
  # NEM IGAZOLT: hogy a 0.3 EZEN a motoron csökkenti a hullámzást. A 0.3-as javaslat
  # egy ChatGPT-n futtatott benchmarkból jön, nem gemini-2.5-flash mérésből — a
  # gyártó-motoron nincs alapvonal. Kockázat mindkét irányban: túl alacsony érték
  # lapos, általános felismeréseket adhat, ami maga is pontlevonás.
  # 'default' vagy üres -> nem állítjuk be, tehát visszatérés a korábbi
  # viselkedésre; ez az A/B másik ága.
  temperature: 'default'
  # reason_temperature / compose_temperature — HÍVÁSONKÉNTI hőmérséklet (2026-08-09).
  # 2026-08-09-ig egyetlen érték hajtotta mindkét hívást, holott a követelményük
  # ELLENTÉTES:
  #   REASON  — a kimenet enum + 0-10 pontszám, nincs benne megőrzendő fogalmazás.
  #             Az egész architektúra ez alatt van (intent -> bias -> vétó ->
  #             stratégia): ha az osztályozás ingadozik, MÁS stratégia nyer, tehát
  #             más komment születik. A v2 elfogadási kritériuma abszolút, nem
  #             statisztikai — az stabil besorolást feltételez. -> ALACSONY.
  #   COMPOSE — a kimenet NYILVÁNOS próza. Alacsony hőmérséklet = modális
  #             tokenválasztás = a leggyakoribb, legáltalánosabb fogalmazás, ami
  #             pontosan az az "LLM-hang", ami ellen a v1 óta minden réteg épült
  #             (ld. a `temperature` fenti kommentjét: "lapos, általános
  #             felismerések"). Ráadásul itt VAN precízebb kontroll: a
  #             determinisztikus kapu fogja a konkrét sértéseket és egy célzott
  #             újraírást kér — a temperature ehhez képest tompa eszköz. -> NEM
  #             visszük le.
  # MIÉRT NEM 0.0 a REASON: a `strategy_fit` hét stratégiát pontoz, és a
  # `pick_strategy` holtversenyben a DEKLARÁCIÓS SORRENDET követi — ott pedig a
  # `constructive_challenge` áll elöl. Egy ellaposodó pontszám-eloszlás tehát nem
  # semleges: csendben a nyilvános kritikát hozná fel gyakori nyertessé olyan
  # posztokon is (portfolio, bejelentés), ahol az a legrosszabb válasz.
  # Hiányzó érték vagy 'inherit' -> a fenti `temperature`, tehát egy régi config
  # viselkedése bitre változatlan. 'default' -> nem állítjuk be (API-default).
  # Mindkét tényleges érték ott van a válaszban (`reason_temperature`,
  # `compose_temperature`), hogy utólag megmagyarázható legyen, melyik lépés min futott.
  reason_temperature: 0.2
  compose_temperature: 'default'
  # TÖRÖLVE (2026-08-10): authenticity_min_score + az Authenticity rubrika.
  # A 2026-08-01-i bevezetésnél a feltétel ez volt: "az egyetlen valódi próba, hogy
  # korrelál-e a kézi benchmark-pontokkal. Ha nem, a rubrika törölhető."
  # HÁROM éles mérés, HÁROM 10/10 — a `no_implementation_drift` mindháromszor 2-t
  # kapott ("nulla drift"), közben a három komment sorrendben ezt írta: külső
  # pontozó "consultant mode"-ot kifogásolt (88/100); "foundational governance" +
  # "naming conventions"; "cultural willingness to embed those capabilities into
  # daily operations". Nem gyenge korreláció volt, hanem NULLA VARIANCIA: egy
  # mérőszám, ami mindig a maximumot adja, nem tud rangsorolni.
  # A helyére a determinisztikus kapu és az F2 konkrétság-diagnosztika lép — azok
  # mért dolgokat mérnek, nem önértékelést kérnek. Nyereség: ~10 kimeneti
  # token/hívás, és eltűnik a 10/10 adta hamis biztonságérzet.
  # A kulcs ELHAGYHATÓ a configból; ha bent marad, a motor figyelmen kívül hagyja.
  # opening_variety — nyitás-rotáció (2026-08-09, engine v5).
  #   'on'  — (ALAPÉRTELMEZÉS) a KÓD jelöl ki egy nyitó-formát kommentenként a
  #           nyolcból, kizárva a legutóbbi négyet, és azt adja át a COMPOSE-nak.
  #   'off' — nincs kijelölés; a compose-prompt BÁJTRA a v4-es, tehát A/B-zhető.
  # MIÉRT KELL: a 2026-08-01-i whitelist hat nyitó-formát *ajánl*, a determinisztikus
  # kapu viszont csak a TANÁCSADÓI nyitásokat tiltja — a motor saját whitelistjének
  # ismétlődése ellen semmi nem védett. Ez a hiba a kommentek KÖZÖTT keletkezik,
  # ezért egy kommenten belüli regex elvileg sem láthatja: két komment külön-külön
  # tökéletes, sorozatban mégis felismerhető. LinkedIn-en ugyanaz a közönség látja
  # a hozzászólásaidat egymás után.
  # KAPCSOLÓDIK a `temperature`-höz: alacsonyabb hőmérséklet éppen a nyitás-
  # választást lapítja el a leginkább. Ez a rotáció teszi biztonságossá a
  # 'default' -> 0.3 váltást, mert a varianciát nem a mintavételre bízza.
  # A választás determinisztikus (poszt-hash), tehát utólag megmagyarázható és
  # tesztelhető — a válasz `opening_shape` és `opening_recent` mezője mutatja.
  # A gyűrű memóriában él, nem lemezen: ez varianciа-állapot, nem adat, így a
  # 03-composer-spec §Hatókör "nincs perzisztencia/history-tábla" kikötése áll.
  # IDÉZŐJEL KELL: a YAML az on/off szavakat booleanná alakítja (HANDOFF §4/17).
  opening_variety: 'on'
  # length_scaling — a cél-szóhossz a POSZT hosszából (2026-08-10, engine v7).
  #   'on'  — (ALAPÉRTELMEZÉS) a kód kiszámolja a sávot és átadja a COMPOSE-nak.
  #   'off' — fix "80-150 words", a v6-os viselkedés (bájtra), tehát A/B-zhető.
  # MIÉRT: nyolc éles generálás mérése — a motor ~100 szót írt, BÁRMI is volt a
  # bemenet (82-117 mind a nyolc esetben):
  #     poszt 101 szó -> komment  82-97   (0.81-0.96x)
  #     poszt 254 szó -> komment 110-117  (0.43-0.46x)
  #     poszt  53 szó -> komment 102-116  (1.92-2.19x)  <- a poszt KÉTSZERESE
  # Egy éles, kétmondatos megfigyelésre dupla hosszan válaszolni szerkezetileg is
  # része annak, amiért tömöttnek érezzük: a HOSSZ IS REGISZTER, és a regisztert
  # illeszteni kell — ugyanaz az elv, ami a nyelv és a `human_temperature` mögött áll.
  # A SZABÁLY: tükrözd a posztot, és vágd le mindkét végén
  # (`LENGTH_TARGET_FLOOR`=55, `LENGTH_TARGET_CEILING`=120, sáv +/-25%). Így
  # 53 szó -> 40-70, 101 szó -> 75-125, 254 szó -> 90-150; vagyis a gyakori
  # (~100 szavas) esetben nagyjából a mai viselkedés marad, és ott változik, ahol a
  # mérés hibát mutatott: a rövid, éles posztoknál.
  # KAPCSOLÓDIK a `MIN_WORDS`-hez: az 60 -> 35 lett. A felülvizsgálat eredménye az
  # volt, hogy a 60-as padló SOHA nem kötött (nulla "túl rövid" sértés nyolc
  # generálásból, a legrövidebb komment 82 szó) — a hosszt a PROMPT szabályozta, nem
  # a kapu. A kettő csak EGYÜTT hat: a padló leengedése önmagában semmit nem
  # változtatott volna, a sáv nélkül pedig a padló tömésre kényszerítene.
  # A sáv UTASÍTÁS, nem kapu: a `target_length` és a `reply_words` a naplóban van,
  # tehát mérhető, betartja-e a modell.
  # IDÉZŐJEL KELL: a YAML az on/off szavakat booleanná alakítja (HANDOFF §4/17).
  length_scaling: 'on'
  # telemetry — soronként egy generált komment döntési nyoma (2026-08-09).
  #   'on'  — minden hívás egy JSON-sort ír a `telemetry_path` fájlba.
  #   'off' — (KÓD-DEFAULT) nem ír semmit.
  # MIÉRT: a motor minden döntést visszaad a válaszban, de a válasz a HTTP-körrel
  # eltűnik. Emiatt négy fontos kérdésre ma nem tudsz felelni:
  #   1. nyer-e valaha a `constructive_challenge` (a bias-terv szerint vélemény- és
  #      debate-poszton nyerhetne — de méri ezt valaki?)
  #   2. (MEGVÁLASZOLVA 2026-08-10: az authenticity-rubrika három mérés után
  #      törölve — nulla variancia, mindháromszor 10/10. A napló adta a választ.)
  #   3. hat-e a hívásonkénti hőmérséklet-bontás
  #   4. szór-e tényleg a nyitás-rotáció, és nő-e tőle az újraírások száma
  # Mind a négy UGYANABBÓL az egy sorból megválaszolható.
  # NEM DB-tábla: a §Hatókör tiltása ÁLLAPOTRA vonatkozik (approve/reject
  # állapotgép, piszkozat-tárolás, UI-ból olvasott előzmény). Ez append-only
  # ténynapló — az alkalmazás soha nem olvassa vissza, nincs hozzá felület.
  # ADATVÉDELEM: a poszt teljes szövege NEM kerül bele (más tartalma) — csak stabil
  # `post_id` hash + 160 karakteres részlet, ami a benchmark-táblához való
  # párosításhoz elég. A KÉP soha, semmilyen formában. A komment teljes szövege
  # benne van: az a saját kimeneted, és pont az, amit pontozol.
  # A naplózás hibája SOHA nem törli el a már kifizetett LLM-hívás eredményét.
  # skip_vendor_promotion — vendor-hirdetés alatt NE generáljunk kommentet (2026-08-10).
  #   'on'  — (ALAPÉRTELMEZÉS) ha a poszt a termék gyártójának marketing-anyaga,
  #           a motor a COMPOSE-hívás ELŐTT kilép: nincs komment, nincs második
  #           LLM-hívás. A UI "Mégis generálj" gombja felülírja (force).
  #   'off' — mindig generál, a korábbi viselkedés.
  # MIÉRT: felhasználói döntés (2026-08-10). Az indok üzleti, nem stilisztikai: egy
  # érdemi komment (a) ingyen engagementet ad a hirdetésnek — a LinkedIn kommentszám
  # szerint rangsorol —, (b) azzá tesz, aki egy SZOMSZÉDOS versenytárs (Newforma:
  # koordináció/interop, vagyis a Bridge mellett) marketingje alatt finoman
  # ellenvetést tesz.
  # MIÉRT NEM ELÉG a `conversation_intent == product_demonstration`: annak
  # definíciója "their own or someone else's" — vagyis egy gyakorló szakember is ide
  # esik, aki a saját épített eszközét mutatja meg. Az PONT olyan poszt, amire
  # válaszolni akarunk. A kettőt csak a REGISZTER választja el, ezért van rá saját
  # séma-mező (`vendor_promotion`) + kötelező, a posztban ELLENŐRZÖTT idézet
  # (`promotion_evidence`) — ugyanaz a zero-hallucination minta, mint a
  # `tool_request_quote`-nál. A modell "ez hirdetés" állítását nem fogadjuk el
  # szavára, mert a következmény az, hogy egyáltalán nem generálunk.
  # IDÉZŐJEL KELL: a YAML az on/off szavakat booleanná alakítja (HANDOFF §4/17).
  skip_vendor_promotion: 'on'
  telemetry: 'on'
  # telemetry_path — relatív út a dashboard gyökeréhez képest (mint a database.path).
  # Soronként egy JSON objektum; pandas/jq/Excel közvetlenül olvassa.
  # Nem forog: napi néhány kézi hívásnál soronként ~2-4 KB, ezer komment ~3 MB.
  telemetry_path: 'storage/linkedin_telemetry.jsonl'
linkedin_content:
  enabled: true
  posts_per_week: 2
  lookback_days: 7
  language: en
weekly_report:
  enabled: true
  day_of_week: mon
  hour: 8
  lookback_days: 7
  language: hu
adhoc:
