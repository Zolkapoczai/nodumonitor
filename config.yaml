ui:
  admin_password: ''
  # Hány lehetőség-kártya renderelődjön a "Lehetőségek" fülön. A csatorna-szűrő
  # kliens-oldali, tehát ami nincs kirenderelve, azt nem is tudja megmutatni —
  # ezért legyen a keret a valódi totál FÖLÖTT. Ha csonkol, a fül status-sora
  # kiírja ("X megjelenítve, összesen Y"). A pillek darabszáma mindig SQL-ből
  # jön, tehát az akkor sem hazudik. Ma 305 lehetőség van.
  opportunities_limit: 400
knowledge_base:
  folders:
  - c:\NODU\NODU technical
  - c:\NODU\NODU technical\Release notes
  - c:\NODU\NODU Bridge Repo
  output_file: storage/nodu_knowledge_base.md
  # Mennyi kerulhet a tudasbazisbol EGY promptba. A fajl ~280 KB (~70k token), es
  # 2026-07-28-ig TELJESEN bekerult minden forum-draft promptjaba (a prompt 99,1%-a).
  # A forum-draft ut MA EGYALTALAN nem hasznalja; ez a keret a heti tartalom- es
  # trend-generalasra vonatkozik. Ld. docs/04-rendszer-audit-2026-07-28.md §2.4.
  prompt_max_chars: 8000
